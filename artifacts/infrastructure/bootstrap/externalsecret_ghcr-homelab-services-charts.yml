---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ghcr-homelab-services-charts
  namespace: argocd
spec:
  data:
    - remoteRef:
        key: ghcr-chart-read-credentials
        property: username
      secretKey: username
    - remoteRef:
        key: ghcr-chart-read-credentials
        property: token
      secretKey: token
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    creationPolicy: Owner
    name: ghcr-homelab-services-charts
    template:
      data:
        enableOCI: "true"
        password: '{{ .token }}'
        type: helm
        url: ghcr.io/nandiheath/homelab-services-charts
        username: '{{ .username }}'
      engineVersion: v2
      metadata:
        labels:
          app.kubernetes.io/part-of: argocd
          argocd.argoproj.io/secret-type: repository
      type: Opaque
