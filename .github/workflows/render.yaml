name: Validate desired state

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Render and validate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Activate pinned Hermit toolchain
        uses: cashapp/activate-hermit@cea9af7913204a965fd488637a8d1811bba2e616 # v1

      - name: Install pinned Hermit tools
        run: ./bin/hermit install

      - name: Install pinned Ansible validation tools
        run: python3 -m pip install ansible-core==2.21.2 ansible-lint==26.6.0

      - name: Install pinned Ansible collections
        run: ansible-galaxy collection install -r ansible/collections/requirements.yml -p ansible/collections

      - name: Require a clean pre-render checkout
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "checkout contains uncommitted changes before rendering" >&2
            git status --short >&2
            exit 1
          fi

      - name: Render changed manifest sources
        env:
          EVENT_BEFORE: ${{ github.event.before }}
          PULL_REQUEST_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          base=$EVENT_BEFORE
          if [ -z "$base" ] || [ "$base" = 0000000000000000000000000000000000000000 ]; then
            base=$PULL_REQUEST_BASE
          fi
          if [ -z "$base" ]; then
            base=HEAD^
          fi
          if ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            git fetch --no-tags --depth=1 origin "$base"
          fi

          declare -A changed_sources=()
          while IFS= read -r -d '' changed_file; do
            relative=${changed_file#argocd/infrastructure/}
            source_name=${relative%%/*}
            if [ -n "$source_name" ] && [ "$source_name" != "$relative" ]; then
              changed_sources["$source_name"]=1
            fi
          done < <(git diff --name-only --no-renames -z "$base" HEAD -- argocd/infrastructure/)

          if [ "${#changed_sources[@]}" -eq 0 ]; then
            echo "No changed manifest sources."
          else
            while IFS= read -r source_name; do
              source_path="argocd/infrastructure/$source_name"
              output_path="artifacts/infrastructure/$source_name"
              if [ -f "$source_path/kustomization.yaml" ]; then
                make render SOURCE="$source_path" OUTPUT="$output_path"
              else
                rm -rf "$output_path"
              fi
            done < <(printf '%s\n' "${!changed_sources[@]}" | sort)
          fi

      - name: Validate lifecycle automation
        run: ./scripts/validate-ansible.sh

      - name: Validate rendered manifests
        run: ./scripts/validate.sh

      - name: Commit rendered artifacts
        env:
          TARGET_BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          if git diff --quiet -- artifacts/; then
            echo "Rendered artifacts are current."
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add artifacts/
          git commit -m "chore(artifacts): render changed manifests"
          git push origin "HEAD:$TARGET_BRANCH"
