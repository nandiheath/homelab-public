name: Validate desired state

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  actions: write
  contents: write

concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Render and validate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          ref: ${{ github.head_ref || github.ref_name }}
          persist-credentials: ${{ github.event_name != 'pull_request' }}

      - name: Activate pinned Hermit toolchain
        uses: cashapp/activate-hermit@cea9af7913204a965fd488637a8d1811bba2e616 # v1

      - name: Install pinned Hermit tools
        run: ./bin/hermit install

      - name: Install pinned Ansible validation tools
        run: python3 -m pip install ansible-core==2.21.2 ansible-lint==26.6.0

      - name: Install pinned Ansible collections
        run: ansible-galaxy collection install -r ansible/collections/requirements.yml -p ansible/collections

      - name: Render changed manifest sources
        run: homelab argocd render --ci

      - name: Validate lifecycle automation
        run: ./scripts/validate-ansible.sh

      - name: Validate rendered manifests
        run: ./scripts/validate.sh

      - name: Detect rendered artifact drift
        id: drift
        shell: bash
        run: |
          if git diff --quiet -- artifacts/ &&
            test -z "$(git ls-files --others --exclude-standard -- artifacts/)"; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit rendered artifacts
        if: steps.drift.outputs.changed == 'true' && github.event_name != 'pull_request'
        run: homelab argocd render --commit-and-push

      - name: Validate generated commit
        if: steps.drift.outputs.changed == 'true' && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run render.yaml --ref "$GITHUB_REF_NAME"

      - name: Fail source-only revision
        if: steps.drift.outputs.changed == 'true'
        run: |
          echo "Rendered artifacts changed; the original source-only revision is invalid." >&2
          exit 1
