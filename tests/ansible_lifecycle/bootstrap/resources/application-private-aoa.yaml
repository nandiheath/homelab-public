apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: private-aoa
  namespace: argocd
spec:
  project: homelab-private
  source:
    repoURL: https://github.com/nandiheath/homelab-private.git
    targetRevision: main
    path: artifacts/application/private-aoa
  destination:
    server: https://kubernetes.default.svc
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
