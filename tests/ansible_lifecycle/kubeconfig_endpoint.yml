---
- name: Exercise kubeconfig endpoint selection without remote contact
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    api_port: 6443
  tasks:
    - name: Resolve fixture kubeconfig endpoint
      ansible.builtin.include_tasks: ../../ansible/roles/k3s_server/tasks/resolve_kubeconfig_endpoint.yml

    - name: Require expected fixture endpoint
      ansible.builtin.assert:
        that:
          - kubeconfig_effective_server == fixture_expected_server
        fail_msg: Kubeconfig endpoint fixture resolved an unexpected server.

    - name: Report endpoint fixture sentinel
      ansible.builtin.debug:
        msg: KUBECONFIG_ENDPOINT_SENTINEL_REACHED
