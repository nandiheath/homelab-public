## Argo Configs
configs:
  # General Argo CD configuration

  # -- Annotations to be added to `configs.repositories` Secret
  repositoriesAnnotations: {}

  # Argo CD sensitive data
  # Ref: https://argo-cd.readthedocs.io/en/stable/operator-manual/user-management/#sensitive-data-and-sso-client-secrets
  secret:
    # -- Create the argocd-secret
    createSecret: true
    
  params:    
    # all hosts are protected by istio mTLS
    server.insecure: true
    

  cm:
    url: https://argocd-homelab.nandi.sh
    
    # Enable server-side diff for Argo CD
    controller.diff.server.side: "true"
    
    # enable admin for local admin account
    admin.enabled: "false"
    
    # Ignore divisor field during diff operations (this is the default value being populated when using server side diff)    
    resource.customizations.ignoreDifferences.apps_Deployment: |
      jqPathExpressions:
      - .spec.template.spec.containers[].env[]?.valueFrom.resourceFieldRef.divisor
    resource.customizations.ignoreDifferences.apps_DaemonSet: |
      jqPathExpressions:
      - .spec.template.spec.containers[].env[]?.valueFrom.resourceFieldRef.divisor
      
    # The GitHub App registration must allow this exact callback:
    # https://argocd-homelab.nandi.sh/api/dex/callback
    dex.config: |
      connectors:
      - type: github
        name: Github
        id: github
        config:
          clientID: Iv1.c4bcc7cfd7caf7f0
          clientSecret: $argocd-github-app:githubAppClientSecret
      
  rbac:
    # RBAC configuration for the configured GitHub administrator identity.
    policy.csv: |
      g, $ARGOCD_ADMIN_GITHUB_USER, role:admin
    # Evaluate the email and GitHub login claims while keeping the default role empty.
    scopes: "[email, preferred_username]"