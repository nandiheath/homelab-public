apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - telemetry.yaml

helmCharts:
- name: istiod
  repo: https://istio-release.storage.googleapis.com/charts
  releaseName: istiod
  namespace: istio-system
  version: 1.30.3
  valuesInline:
    meshConfig:
      defaultConfig:
        proxyMetadata:
          ISTIO_META_ENABLE_HBONE: "true"
    pilot:
      env:
        PILOT_ENABLE_AMBIENT: true
