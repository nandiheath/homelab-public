apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ghcr-homelab-services-charts
  namespace: argocd
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: ghcr-homelab-services-charts
    creationPolicy: Owner
    template:
      type: Opaque
      engineVersion: v2
      metadata:
        labels:
          argocd.argoproj.io/secret-type: repository
          app.kubernetes.io/part-of: argocd
      data:
        type: helm
        url: ghcr.io/nandiheath/charts
        enableOCI: "true"
        username: "{{ .username }}"
        password: "{{ .token }}"
  data:
    - secretKey: username
      remoteRef:
        key: ghcr-chart-read-credentials
        property: username
    - secretKey: token
      remoteRef:
        key: ghcr-chart-read-credentials
        property: token
