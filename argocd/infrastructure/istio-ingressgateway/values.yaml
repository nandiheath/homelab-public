# https://github.com/istio/istio/blob/1.19.1/manifests/charts/gateway/values.yaml
service:
  # Keep the Cloudflare Tunnel's cluster-local path while also exposing one
  # stable private-LAN address through MetalLB.
  type: LoadBalancer
  ports:
    - name: status-port
      port: 15021
      protocol: TCP
      targetPort: 15021
    - name: http2
      port: 80
      protocol: TCP
      targetPort: 80
    - name: https
      port: 443
      protocol: TCP
      targetPort: 443
    - name: tls-mqtt
      port: 8883
      protocol: TCP
      targetPort: 8883
  annotations:
    metallb.io/address-pool: homelab-ingress
  loadBalancerSourceRanges: []
  externalTrafficPolicy: ""
  externalIPs: []
  ipFamilyPolicy: ""
  ipFamilies: []

name: istio-ingressgateway
labels:
  istio: ingressgateway
