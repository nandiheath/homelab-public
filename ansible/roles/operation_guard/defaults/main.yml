---
# This role is included from a controller-only authorization play before any
# play that can become, delegate a mutation, or contact a managed host.
operation_guard_invocation: direct
operation_guard_operation: ""
operation_guard_parent_context: {}

operation_guard_cluster_id: "{{ cluster_id | default('', true) }}"
operation_guard_expected_server_count: 3
operation_guard_minimum_ansible_version: 2.16.0
operation_guard_controller_owner: "{{ lookup('ansible.builtin.env', 'USER') }}"
operation_guard_known_hosts_file: "{{ lookup('ansible.builtin.env', 'HOME') }}/.ssh/known_hosts"
operation_guard_kubeconfig: ""
operation_guard_temporary_credential_files: []
operation_guard_required_controller_tools: []

# Lifecycle playbooks pass these explicitly. They are intentionally empty by
# default so a missing value cannot accidentally authorize an upgrade.
operation_guard_source_version: ""
operation_guard_target_version: ""

operation_guard_kernel_release: 5.15.0-1105-raspi
operation_guard_expected_k3s_install_version: v1.36.2+k3s1
operation_guard_expected_k3s_target_version: v1.36.2+k3s1
operation_guard_expected_k3s_releases:
  v1.36.2+k3s1:
    etcd_version: v3.6.12-k3s1
    arm64_sha256: 1dc5fc17f15c28fa0a3f011cee28ad613f918c3d967a426e5a05d43ddb239817

operation_guard_upgrade_paths: {}

operation_guard_confirmations:
  reset: "RESET {{ operation_guard_cluster_id }} AND DESTROY ALL KUBERNETES DATA"
  kernel_activation: "ACTIVATE KERNEL {{ operation_guard_kernel_release }} ON {{ operation_guard_cluster_id }}"
  k3s_install: "INSTALL K3S {{ operation_guard_expected_k3s_install_version }} ON {{ operation_guard_cluster_id }}"
  bootstrap_network: "BOOTSTRAP NETWORK {{ operation_guard_cluster_id }}"
  bootstrap_gitops: "BOOTSTRAP {{ operation_guard_cluster_id }}"
