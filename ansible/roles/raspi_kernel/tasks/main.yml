---
- name: Validate pinned kernel maintenance inputs
  ansible.builtin.assert:
    that:
      - ansible_distribution == 'Ubuntu'
      - ansible_architecture in ['aarch64', 'arm64']
      - raspi_kernel_mode in ['cluster_present', 'cluster_absent']
      - raspi_kernel_packages | length == 2
      - raspi_kernel_packages | select('match', '^(linux-image-raspi|linux-raspi)=5\.15\.0\.1105\.103$') | list | length == 2
      - raspi_kernel_release == '5.15.0-1105-raspi'
      - raspi_kernel_fallback_release == '5.15.0-1102-raspi'
    fail_msg: Pinned Raspberry Pi kernel maintenance input is unsafe.

- name: Capture the pre-maintenance kernel
  ansible.builtin.set_fact:
    raspi_kernel_previous_release: "{{ ansible_kernel }}"

- name: Require an approved pre-maintenance kernel in cluster-absent mode
  ansible.builtin.assert:
    that:
      - raspi_kernel_previous_release in [raspi_kernel_fallback_release, raspi_kernel_release]
    fail_msg: Cluster-absent kernel maintenance requires the retained fallback or already-active pinned kernel.
  when: raspi_kernel_mode == 'cluster_absent'

- name: Determine whether pinned-kernel reboot is required
  ansible.builtin.set_fact:
    raspi_kernel_reboot_required: "{{ raspi_kernel_previous_release != raspi_kernel_release }}"

- name: Require K3s absence for cluster-absent maintenance
  ansible.builtin.command:
    argv: [systemctl, is-active, k3s]
  register: raspi_kernel_k3s_service
  changed_when: false
  failed_when: false
  when: raspi_kernel_mode == 'cluster_absent'

- name: Refuse cluster-absent mode with K3s present
  ansible.builtin.assert:
    that:
      - raspi_kernel_k3s_service.rc != 0
    fail_msg: Cluster-absent kernel maintenance requires K3s to be absent.
  when: raspi_kernel_mode == 'cluster_absent'

- name: Require no K3s process for cluster-absent maintenance
  ansible.builtin.command:
    argv: [pgrep, --exact, k3s]
  register: raspi_kernel_k3s_process
  changed_when: false
  failed_when: false
  when: raspi_kernel_mode == 'cluster_absent'

- name: Refuse cluster-absent mode with a K3s process
  ansible.builtin.assert:
    that:
      - raspi_kernel_k3s_process.rc != 0
    fail_msg: Cluster-absent kernel maintenance requires no running K3s process.
  when: raspi_kernel_mode == 'cluster_absent'

- name: Require cluster-absent K3s paths to be absent
  ansible.builtin.stat:
    path: "{{ item }}"
  loop:
    - /usr/local/bin/k3s
    - /var/lib/rancher/k3s
  register: raspi_kernel_k3s_paths
  when: raspi_kernel_mode == 'cluster_absent'

- name: Refuse cluster-absent mode with K3s paths
  ansible.builtin.assert:
    that:
      - not item.stat.exists
    fail_msg: Cluster-absent kernel maintenance requires K3s paths to be absent.
  loop: "{{ raspi_kernel_k3s_paths.results | default([]) }}"
  when: raspi_kernel_mode == 'cluster_absent'

- name: Check package manager integrity before installation
  ansible.builtin.command:
    argv: "{{ item }}"
  loop:
    - [dpkg, --audit]
    - [apt-get, check]
  changed_when: false

- name: Inspect exact pinned kernel package versions before installation
  ansible.builtin.command:
    argv:
      - dpkg-query
      - -W
      - "-f=${Version}"
      - "{{ item.split('=')[0] }}"
  register: raspi_kernel_existing_packages
  changed_when: false
  failed_when: false
  loop: "{{ raspi_kernel_packages }}"
  loop_control:
    label: "{{ item.split('=')[0] }}"

- name: Determine whether pinned kernel package installation is required
  ansible.builtin.set_fact:
    raspi_kernel_install_required: >-
      {{
        raspi_kernel_existing_packages.results
        | selectattr('rc', 'ne', 0)
        | list
        | length > 0
        or
        raspi_kernel_existing_packages.results
        | map(attribute='stdout')
        | list
        !=
        raspi_kernel_packages
        | map('regex_replace', '^[^=]+=', '')
        | list
      }}

- name: Inspect boot firmware capacity
  ansible.builtin.command:
    argv: [df, -Pk, "{{ raspi_kernel_boot_capacity_path }}"]
  register: raspi_kernel_boot_capacity
  changed_when: false
  when: raspi_kernel_install_required

- name: Require boot firmware free capacity
  ansible.builtin.assert:
    that: (raspi_kernel_boot_capacity.stdout_lines[-1].split()[3] | int) >= 18432
    fail_msg: Boot firmware partition lacks the required 18 MiB free capacity.
  when: raspi_kernel_install_required

- name: Install only exact pinned kernel packages
  ansible.builtin.apt:
    name: "{{ raspi_kernel_packages }}"
    state: present
    update_cache: false
    allow_downgrade: false
    autoremove: false
  when: raspi_kernel_install_required

- name: Verify exact pinned kernel package versions
  ansible.builtin.command:
    argv:
      - dpkg-query
      - -W
      - "-f=${Version}"
      - "{{ item.split('=')[0] }}"
  register: raspi_kernel_installed_packages
  changed_when: false
  loop: "{{ raspi_kernel_packages }}"
  loop_control:
    label: "{{ item.split('=')[0] }}"

- name: Require exact pinned kernel package versions
  ansible.builtin.assert:
    that:
      - item.stdout == raspi_kernel_packages[ansible_loop.index0].split('=')[1]
    fail_msg: Installed Raspberry Pi kernel package does not match the exact pin.
  loop: "{{ raspi_kernel_installed_packages.results }}"
  loop_control:
    label: "{{ item.item.split('=')[0] }}"
    extended: true

- name: Reboot each node into the pinned kernel
  ansible.builtin.reboot:
    reboot_timeout: 600
    post_reboot_delay: 5
  when: raspi_kernel_reboot_required

- name: Refresh kernel facts after reboot
  ansible.builtin.setup:
    gather_subset:
      - kernel
  when: raspi_kernel_reboot_required

- name: Require the exact active kernel release
  ansible.builtin.command:
    argv: [uname, -r]
  register: raspi_kernel_active_release
  changed_when: false

- name: Assert active pinned kernel release
  ansible.builtin.assert:
    that:
      - raspi_kernel_active_release.stdout == raspi_kernel_release
      - ansible_kernel == raspi_kernel_release
    fail_msg: Rebooted node did not activate the pinned Raspberry Pi kernel.

- name: Check reboot-required marker
  ansible.builtin.stat:
    path: /var/run/reboot-required
  register: raspi_kernel_reboot_marker

- name: Require reboot-required marker to be cleared
  ansible.builtin.assert:
    that:
      - not raspi_kernel_reboot_marker.stat.exists
    fail_msg: Pinned kernel activation left a reboot-required marker behind.

- name: Check expected boot files
  ansible.builtin.stat:
    path: "{{ item }}"
  loop:
    - "{{ raspi_kernel_boot_path }}/vmlinuz"
    - "{{ raspi_kernel_boot_path }}/initrd.img"
    - "{{ raspi_kernel_boot_path }}/vmlinuz-{{ raspi_kernel_release }}"
    - "{{ raspi_kernel_boot_path }}/vmlinuz-{{ raspi_kernel_fallback_release }}"
  register: raspi_kernel_boot_files

- name: Require expected boot files and retained fallback
  ansible.builtin.assert:
    that:
      - item.stat.exists
    fail_msg: Pinned kernel activation did not leave the expected boot files or retained fallback.
  loop: "{{ raspi_kernel_boot_files.results }}"
  loop_control:
    label: "{{ item.item }}"

- name: Check package manager integrity after reboot
  ansible.builtin.command:
    argv: "{{ item }}"
  loop:
    - [dpkg, --audit]
    - [apt-get, check]
  changed_when: false

- name: Recheck K3s absence after reboot
  ansible.builtin.command:
    argv: [systemctl, is-active, k3s]
  register: raspi_kernel_post_reboot_k3s
  changed_when: false
  failed_when: false
  when: raspi_kernel_mode == 'cluster_absent'

- name: Require K3s to remain absent after reboot
  ansible.builtin.assert:
    that:
      - raspi_kernel_post_reboot_k3s.rc != 0
    fail_msg: K3s became active during cluster-absent kernel maintenance.
  when: raspi_kernel_mode == 'cluster_absent'
