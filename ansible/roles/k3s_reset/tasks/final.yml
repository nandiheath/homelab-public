---
- name: Verify no cluster host listens on Kubernetes API port
  ansible.builtin.wait_for:
    host: "{{ hostvars[item].ansible_host | default(item, true) }}"
    port: 6443
    state: stopped
    timeout: 5
  loop: "{{ reset_expected_servers }}"
  delegate_to: localhost
  become: false

- name: Remove controller kubeconfig once after complete reset
  ansible.builtin.file:
    path: "{{ reset_kubeconfig }}"
    state: absent
  when: reset_kubeconfig | length > 0
  delegate_to: localhost
  become: false

- name: Verify controller kubeconfig is absent after complete reset
  ansible.builtin.stat:
    path: "{{ reset_kubeconfig }}"
  register: reset_kubeconfig_stat
  when: reset_kubeconfig | length > 0
  delegate_to: localhost
  become: false

- name: Require controller kubeconfig absent after complete reset
  ansible.builtin.assert:
    that: not reset_kubeconfig_stat.stat.exists
    fail_msg: Controller kubeconfig remains after complete reset.
  when: reset_kubeconfig | length > 0
  delegate_to: localhost
  become: false
