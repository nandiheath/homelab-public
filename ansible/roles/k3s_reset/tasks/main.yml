---
- name: Validate the role-aware destructive wipe
  ansible.builtin.assert:
    that:
      - reset_wipe_role is string
      - reset_wipe_role in ['server', 'agent']
      - reset_preservation_baseline is defined
      - reset_preservation_baseline is mapping
      - inventory_hostname in groups['k3s_cluster']
      - (reset_wipe_role == 'server') == ('server' in group_names)
      - (reset_wipe_role == 'agent') == ('agent' in group_names)
    fail_msg: >-
      Refusing destructive wipe: this host lacks its captured preservation
      baseline or does not match the requested K3s role.

- name: Uninstall the role-owned K3s installation
  ansible.builtin.include_tasks: wipe.yml

- name: Assert cluster absence and host preservation
  ansible.builtin.include_tasks: assert_absence.yml
