---
- name: Recheck reset inventory and controller inputs
  ansible.builtin.assert:
    that:
      - reset_kubeconfig is string
      - reset_kubeconfig | length > 0
      - reset_kubectl is string
      - reset_kubectl | length > 0
      - reset_expected_servers is sequence
      - reset_expected_servers is not string
      - reset_expected_servers | length == 3
      - reset_expected_servers | sort == groups['server'] | sort
      - groups['k3s_cluster'] | sort == (groups['server'] + groups.get('agent', [])) | unique | sort
      - reset_expected_servers | map('extract', hostvars, 'reset_preservation_baseline') | select('defined') | list | length == 3
      - groups['k3s_cluster'] | map('extract', hostvars, 'reset_preservation_baseline') | select('defined') | list | length == groups['k3s_cluster'] | length
    fail_msg: >-
      Refusing destructive reset: controller inputs, current inventory, or
      captured host identities do not match the approved three-server cluster.

- name: Refresh exact live host identity immediately before reset authorization
  ansible.builtin.setup:
    gather_subset:
      - min
      - distribution
      - kernel
      - network
  loop: "{{ groups['k3s_cluster'] }}"
  loop_control:
    label: "{{ item }}"
  delegate_to: "{{ item }}"
  delegate_facts: true
  become: true

- name: Refresh live user inventory immediately before reset authorization
  ansible.builtin.command:
    argv:
      - /usr/bin/python3
      - -c
      - |
        import pwd
        print("\n".join(sorted(entry.pw_name for entry in pwd.getpwall())))
  loop: "{{ groups['k3s_cluster'] }}"
  loop_control:
    label: "{{ item }}"
  register: reset_preflight_users
  changed_when: false
  delegate_to: "{{ item }}"
  become: true
- name: Require exact live host identity before accepting reset confirmation
  ansible.builtin.assert:
    that:
      - hostvars[item.0].ansible_facts.hostname == hostvars[item.0].reset_preservation_baseline.hostname
      - hostvars[item.0].ansible_facts.distribution == hostvars[item.0].reset_preservation_baseline.distribution
      - hostvars[item.0].ansible_facts.distribution_version == hostvars[item.0].reset_preservation_baseline.distribution_version
      - hostvars[item.0].ansible_facts.os_family == hostvars[item.0].reset_preservation_baseline.os_family
      - hostvars[item.0].ansible_facts.kernel == hostvars[item.0].reset_preservation_baseline.kernel
      - hostvars[item.0].ansible_facts.default_ipv4 == hostvars[item.0].reset_preservation_baseline.network_identity
      - hostvars[item.0].reset_preservation_baseline.inventory_address == hostvars[item.0].reset_preservation_baseline.network_identity.address
      - item.1.rc == 0
      - (item.1.stdout_lines | map('regex_replace', ':.*$', '') | list | sort) == hostvars[item.0].reset_preservation_baseline.users
  loop: "{{ groups['k3s_cluster'] | zip(reset_preflight_users.results) | list }}"
  loop_control:
    label: "{{ item.0 }}"


- name: Require the populated cluster health gate
  ansible.builtin.include_role:
    name: cluster_health
  vars:
    cluster_health_kubeconfig: "{{ reset_kubeconfig }}"
    cluster_health_kubectl: "{{ reset_kubectl }}"
    cluster_health_expected_servers: "{{ reset_expected_servers | map('extract', hostvars, 'reset_preservation_baseline') | map(attribute='hostname') | list }}"
    cluster_health_mode: populated
    cluster_health_required_controllers: []

- name: Read Kubernetes version facts as JSON
  ansible.builtin.command:
    argv: ["{{ reset_kubectl }}", --kubeconfig, "{{ reset_kubeconfig }}", version, --output=json]
  register: reset_kubernetes_version
  changed_when: false

- name: Read Kubernetes node facts as JSON
  ansible.builtin.command:
    argv: ["{{ reset_kubectl }}", --kubeconfig, "{{ reset_kubeconfig }}", get, nodes, --output=json]
  register: reset_nodes
  changed_when: false

- name: Read Argo Application facts as JSON
  ansible.builtin.command:
    argv: ["{{ reset_kubectl }}", --kubeconfig, "{{ reset_kubeconfig }}", get, applications.argoproj.io, --all-namespaces, --output=json]
  register: reset_applications
  changed_when: false
  failed_when: false

- name: Read persistent volume claim facts as JSON
  ansible.builtin.command:
    argv: ["{{ reset_kubectl }}", --kubeconfig, "{{ reset_kubeconfig }}", get, pvc, --all-namespaces, --output=json]
  register: reset_pvcs
  changed_when: false

- name: Read local embedded-etcd health metrics from every expected server
  ansible.builtin.command:
    argv:
      - /usr/bin/python3
      - -c
      - |
        import json
        import urllib.request

        lines = urllib.request.urlopen(
            "http://127.0.0.1:2381/metrics", timeout=10
        ).read().decode().splitlines()

        def metric_value(name):
            matches = [line for line in lines if line.startswith(name + " ")]
            if len(matches) != 1:
                raise ValueError(f"expected exactly one {name} metric")
            return int(float(matches[0].rsplit(" ", 1)[1]))

        def metric_label(name, label):
            matches = [line for line in lines if line.startswith(name + "{")]
            if len(matches) != 1:
                raise ValueError(f"expected exactly one {name} metric")
            return matches[0].split(f'{label}="', 1)[1].split('"', 1)[0]

        active_peers = sorted(
            line.split('Remote="', 1)[1].split('"', 1)[0]
            for line in lines
            if line.startswith("etcd_network_active_peers{") and line.endswith(" 1")
        )
        print(json.dumps({
            "active_peers": active_peers,
            "has_leader": metric_value("etcd_server_has_leader"),
            "is_leader": metric_value("etcd_server_is_leader"),
            "is_learner": metric_value("etcd_server_is_learner"),
            "server_id": metric_label("etcd_server_id", "server_id"),
            "server_version": metric_label("etcd_server_version", "server_version"),
        }, sort_keys=True))
  loop: "{{ reset_expected_servers }}"
  loop_control:
    label: "{{ item }}"
  register: reset_etcd_metrics
  changed_when: false
  delegate_to: "{{ item }}"
  become: true

- name: Parse embedded-etcd health observations
  ansible.builtin.set_fact:
    reset_etcd_observations: "{{ reset_etcd_metrics.results | map(attribute='stdout') | map('from_json') | list }}"

- name: Require three healthy current voting embedded-etcd members
  ansible.builtin.assert:
    that:
      - reset_etcd_observations | length == 3
      - reset_etcd_observations | map(attribute='has_leader') | unique | list == [1]
      - reset_etcd_observations | map(attribute='is_learner') | sum == 0
      - reset_etcd_observations | map(attribute='is_leader') | sum == 1
      - reset_etcd_observations | map(attribute='server_id') | unique | list | length == 3
      - reset_etcd_observations | map(attribute='server_version') | unique | list | length == 1
      - reset_etcd_observations | map(attribute='active_peers') | map('length') | unique | list == [2]
    fail_msg: >-
      Refusing destructive reset: embedded etcd is not exactly three healthy,
      mutually connected, current voting members.

- name: Require every embedded-etcd member to see exactly the other two peers
  ansible.builtin.assert:
    that:
      - item.active_peers | sort == reset_etcd_observations | map(attribute='server_id') | difference([item.server_id]) | sort
    fail_msg: >-
      Refusing destructive reset: embedded-etcd peer topology does not match the
      three expected voting members.
  loop: "{{ reset_etcd_observations }}"
  loop_control:
    label: "{{ item.server_id }}"

- name: Emit approved non-secret cluster facts before reset confirmation
  ansible.builtin.debug:
    msg:
      live_identity:
        hosts: "{{ groups['k3s_cluster'] }}"
        addresses: "{{ groups['k3s_cluster'] | map('extract', hostvars, 'reset_preservation_baseline') | map(attribute='inventory_address') | list }}"
        hostnames: "{{ groups['k3s_cluster'] | map('extract', hostvars, 'reset_preservation_baseline') | map(attribute='hostname') | list }}"
        os: "{{ groups['k3s_cluster'] | map('extract', hostvars, 'reset_preservation_baseline') | map(attribute='distribution') | list }}"
        kernels: "{{ groups['k3s_cluster'] | map('extract', hostvars, 'reset_preservation_baseline') | map(attribute='kernel') | list }}"
      kubernetes_version: "{{ reset_kubernetes_version.stdout | from_json }}"
      nodes: >-
        {%- set projection = namespace(items=[]) -%}
        {%- for item in (reset_nodes.stdout | from_json).items -%}
          {%- set projection.items = projection.items + [{
            'name': item.metadata.name,
            'version': item.status.nodeInfo.kubeletVersion
          }] -%}
        {%- endfor -%}
        {{ projection.items }}
      etcd_members: "{{ reset_etcd_observations }}"
      applications: >-
        {%- set projection = namespace(items=[]) -%}
        {%- if reset_applications.rc == 0 -%}
          {%- for item in (reset_applications.stdout | from_json).items -%}
            {%- set projection.items = projection.items + [{
              'namespace': item.metadata.namespace,
              'name': item.metadata.name
            }] -%}
          {%- endfor -%}
        {%- endif -%}
        {{ projection.items }}
      persistent_volume_claims: >-
        {%- set projection = namespace(items=[]) -%}
        {%- for item in (reset_pvcs.stdout | from_json).items -%}
          {%- set projection.items = projection.items + [{
            'namespace': item.metadata.namespace,
            'name': item.metadata.name,
            'class': item.spec.storageClassName,
            'requested': item.spec.resources.requests.storage
          }] -%}
        {%- endfor -%}
        {{ projection.items }}
