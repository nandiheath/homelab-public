---
- name: Recheck reset inventory and controller inputs
  ansible.builtin.assert:
    that:
      - reset_kubeconfig is string
      - reset_kubeconfig | length > 0
      - reset_kubectl is string
      - reset_kubectl | length > 0
      - reset_expected_servers is sequence
      - reset_expected_servers is not string
      - reset_expected_servers | length == 3
      - reset_expected_servers | sort == groups['server'] | sort
      - groups['k3s_cluster'] | sort == (groups['server'] + groups.get('agent', [])) | unique | sort
      - reset_expected_servers | map('extract', hostvars, 'reset_preservation_baseline') | select('defined') | list | length == 3
    fail_msg: >-
      Refusing destructive reset: controller inputs, current inventory, or
      captured host identities do not match the approved three-server cluster.

- name: Require the populated cluster health gate
  ansible.builtin.include_role:
    name: cluster_health
  vars:
    cluster_health_kubeconfig: "{{ reset_kubeconfig }}"
    cluster_health_kubectl: "{{ reset_kubectl }}"
    cluster_health_expected_servers: "{{ reset_expected_servers }}"
    cluster_health_mode: populated
    cluster_health_required_controllers: []

- name: Read Kubernetes version facts as JSON
  ansible.builtin.command:
    argv: ["{{ reset_kubectl }}", --kubeconfig, "{{ reset_kubeconfig }}", version, --output=json]
  register: reset_kubernetes_version
  changed_when: false

- name: Read Kubernetes node facts as JSON
  ansible.builtin.command:
    argv: ["{{ reset_kubectl }}", --kubeconfig, "{{ reset_kubeconfig }}", get, nodes, --output=json]
  register: reset_nodes
  changed_when: false

- name: Read Argo Application facts as JSON
  ansible.builtin.command:
    argv: ["{{ reset_kubectl }}", --kubeconfig, "{{ reset_kubeconfig }}", get, applications.argoproj.io, --all-namespaces, --output=json]
  register: reset_applications
  changed_when: false
  failed_when: false

- name: Read persistent volume claim facts as JSON
  ansible.builtin.command:
    argv: ["{{ reset_kubectl }}", --kubeconfig, "{{ reset_kubeconfig }}", get, pvc, --all-namespaces, --output=json]
  register: reset_pvcs
  changed_when: false

- name: Read embedded etcd endpoint status as JSON
  ansible.builtin.command:
    argv:
      - "{{ reset_etcdctl }}"
      - --endpoints=https://127.0.0.1:2379
      - --cacert=/var/lib/rancher/k3s/server/tls/etcd/server-ca.crt
      - --cert=/var/lib/rancher/k3s/server/tls/etcd/client.crt
      - --key=/var/lib/rancher/k3s/server/tls/etcd/client.key
      - endpoint
      - status
      - --write-out=json
  register: reset_etcd_status
  changed_when: false
  delegate_to: "{{ reset_expected_servers[0] }}"
  become: true

- name: Read embedded etcd membership as JSON
  ansible.builtin.command:
    argv:
      - "{{ reset_etcdctl }}"
      - --endpoints=https://127.0.0.1:2379
      - --cacert=/var/lib/rancher/k3s/server/tls/etcd/server-ca.crt
      - --cert=/var/lib/rancher/k3s/server/tls/etcd/client.crt
      - --key=/var/lib/rancher/k3s/server/tls/etcd/client.key
      - member
      - list
      - --write-out=json
  register: reset_etcd_members
  changed_when: false
  delegate_to: "{{ reset_expected_servers[0] }}"
  become: true

- name: Require three current voting embedded etcd members
  ansible.builtin.assert:
    that:
      - reset_etcd_status.stdout | from_json | length == 1
      - reset_etcd_members.stdout | from_json | json_query('members[?isLearner==`false`]') | length == 3
      - reset_etcd_members.stdout | from_json | json_query('members[?isLearner==`true`]') | length == 0
      - reset_etcd_members.stdout | from_json | json_query('members[].name') | sort == reset_expected_servers | map('extract', hostvars, 'ansible_hostname') | list | sort
    fail_msg: >-
      Refusing destructive reset: embedded etcd is not exactly the current
      three-server, voting membership.

- name: Emit approved non-secret cluster facts before reset
  ansible.builtin.debug:
    msg:
      kubernetes_version: "{{ reset_kubernetes_version.stdout | from_json }}"
      nodes: "{{ reset_nodes.stdout | from_json | json_query('items[].{name: metadata.name, version: status.nodeInfo.kubeletVersion}') }}"
      etcd_status: "{{ reset_etcd_status.stdout | from_json }}"
      etcd_members: "{{ reset_etcd_members.stdout | from_json | json_query('members[].{name: name, learner: isLearner, peer_urls: peerURLs}') }}"
      applications: >-
        {{ reset_applications.stdout | from_json | json_query('items[].{namespace: metadata.namespace, name: metadata.name}') if reset_applications.rc == 0 else [] }}
      persistent_volume_claims: "{{ reset_pvcs.stdout | from_json | json_query('items[].{namespace: metadata.namespace, name: metadata.name, class: spec.storageClassName, requested: spec.resources.requests.storage}') }}"
