---
# Every path below is owned by K3s, Cilium, or Longhorn. Do not add operating
# system, SSH, boot, user, or general network configuration paths here.
reset_kubeconfig: "{{ kubeconfig | default('', true) }}"
reset_kubectl: "{{ controller_kubectl | default(playbook_dir ~ '/../../bin/kubectl', true) }}"
reset_expected_servers: "{{ groups['server'] | default([]) }}"
reset_wipe_role: ""

reset_server_uninstall: /usr/local/bin/k3s-uninstall.sh
reset_agent_uninstall: /usr/local/bin/k3s-agent-uninstall.sh

reset_cluster_owned_paths:
  - /etc/rancher/k3s
  - /var/lib/rancher/k3s
  - /var/lib/longhorn
  - /var/lib/cni/networks/cilium
  - /etc/cni/net.d/05-cilium.conflist
  - /etc/cni/net.d/cilium-cni.conf
  - /run/cilium
  - /var/run/cilium
  - /run/flannel
  - /var/run/flannel
  - /etc/systemd/system/k3s.service
  - /etc/systemd/system/k3s-agent.service
  - /etc/systemd/system/k3s.service.env
  - /etc/systemd/system/k3s-agent.service.env
  - /usr/local/bin/k3s-killall.sh
  - /usr/local/bin/k3s
  - /usr/local/bin/k3s-uninstall.sh
  - /usr/local/bin/k3s-agent-uninstall.sh

reset_absent_paths:
  - /etc/rancher/k3s
  - /var/lib/rancher/k3s
  - /var/lib/longhorn
  - /var/lib/cni/networks/cilium
  - /etc/cni/net.d/05-cilium.conflist
  - /etc/cni/net.d/cilium-cni.conf
  - /run/cilium
  - /var/run/cilium
  - /run/flannel
  - /var/run/flannel
  - /etc/systemd/system/k3s.service
  - /etc/systemd/system/k3s-agent.service
  - /etc/systemd/system/k3s.service.env
  - /etc/systemd/system/k3s-agent.service.env
  - /usr/local/bin/k3s-killall.sh
  - /usr/local/bin/k3s-uninstall.sh
  - /usr/local/bin/k3s-agent-uninstall.sh
  - /usr/local/bin/k3s
