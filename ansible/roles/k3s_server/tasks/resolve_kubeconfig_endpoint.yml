---
- name: Validate kubeconfig endpoint selection inputs
  ansible.builtin.assert:
    that:
      - groups['server'] is defined
      - groups['server'] is sequence
      - groups['server'] is not string
      - groups['server'] | length > 0
      - (kubeconfig_endpoint_mode | default('direct', true)) in ['stable', 'direct']
      - api_port is defined
      - api_port | int > 0
      - api_port | int < 65536
    fail_msg: Refusing kubeconfig export because endpoint selection inputs are invalid.
  delegate_to: localhost
  become: false
  run_once: true

- name: Build server endpoint rejection set
  ansible.builtin.set_fact:
    kubeconfig_server_endpoints: >-
      {{
        (kubeconfig_server_endpoints | default([]))
        + [item]
        + (
            [hostvars[item].ansible_host]
            if hostvars[item].ansible_host is defined
            else []
          )
      }}
  loop: "{{ groups['server'] }}"
  delegate_to: localhost
  become: false
  run_once: true

- name: Resolve direct and stable kubeconfig endpoints
  ansible.builtin.set_fact:
    kubeconfig_resolved_mode: "{{ kubeconfig_endpoint_mode | default('direct', true) }}"
    kubeconfig_direct_endpoint: "{{ hostvars[groups['server'][0]].ansible_host | default(groups['server'][0], true) }}"
    kubeconfig_stable_endpoint: "{{ api_endpoint | default('', true) }}"
  delegate_to: localhost
  become: false
  run_once: true

- name: Reject a missing or direct server endpoint in stable mode
  ansible.builtin.assert:
    that:
      - kubeconfig_stable_endpoint is string
      - kubeconfig_stable_endpoint | length > 0
      - kubeconfig_stable_endpoint not in kubeconfig_server_endpoints
    fail_msg: Stable kubeconfig mode requires a dedicated API endpoint that is not any server inventory name or address.
  when: kubeconfig_resolved_mode == 'stable'
  delegate_to: localhost
  become: false
  run_once: true

- name: Select effective kubeconfig endpoint
  ansible.builtin.set_fact:
    kubeconfig_effective_endpoint: >-
      {{
        kubeconfig_direct_endpoint
        if kubeconfig_resolved_mode == 'direct'
        else kubeconfig_stable_endpoint
      }}
  delegate_to: localhost
  become: false
  run_once: true
- name: Build effective kubeconfig server URL
  ansible.builtin.set_fact:
    kubeconfig_effective_server: "https://{{ kubeconfig_effective_endpoint }}:{{ api_port }}"
  delegate_to: localhost
  become: false
  run_once: true
