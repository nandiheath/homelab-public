---
- name: Wait for K3s kubeconfig
  ansible.builtin.wait_for:
    path: /etc/rancher/k3s/k3s.yaml
    state: present
    timeout: 120
  when: inventory_hostname == groups['server'][0]
  run_once: true

- name: Wait for K3s API readiness
  ansible.builtin.command:
    argv:
      - k3s
      - kubectl
      - get
      - --raw=/readyz
  register: k3s_readyz
  changed_when: false
  retries: 30
  delay: 2
  until: k3s_readyz.rc == 0
  when: inventory_hostname == groups['server'][0]
  run_once: true

- name: Create controller kubeconfig directory
  ansible.builtin.file:
    path: "{{ kubeconfig | dirname }}"
    state: directory
    mode: "0700"
  delegate_to: localhost
  become: false
  when: inventory_hostname == groups['server'][0]
  run_once: true

- name: Fetch K3s kubeconfig to controller
  ansible.builtin.fetch:
    src: /etc/rancher/k3s/k3s.yaml
    dest: "{{ kubeconfig }}"
    flat: true
  when: inventory_hostname == groups['server'][0]
  run_once: true

- name: Restrict controller kubeconfig permissions
  ansible.builtin.file:
    path: "{{ kubeconfig }}"
    state: file
    mode: "0600"
  delegate_to: localhost
  become: false
  when: inventory_hostname == groups['server'][0]
  run_once: true

- name: Point kubeconfig cluster at inventory API endpoint
  ansible.builtin.command:
    argv:
      - "{{ controller_kubectl }}"
      - --kubeconfig
      - "{{ kubeconfig }}"
      - config
      - set-cluster
      - default
      - "--server=https://{{ api_endpoint }}:{{ api_port }}"
  delegate_to: localhost
  become: false
  when: inventory_hostname == groups['server'][0]
  run_once: true

- name: List kubeconfig contexts
  ansible.builtin.command:
    argv:
      - "{{ controller_kubectl }}"
      - --kubeconfig
      - "{{ kubeconfig }}"
      - config
      - get-contexts
      - -o
      - name
  register: kubeconfig_contexts
  changed_when: false
  delegate_to: localhost
  become: false
  when: inventory_hostname == groups['server'][0]
  run_once: true

- name: Rename default kubeconfig context
  ansible.builtin.command:
    argv:
      - "{{ controller_kubectl }}"
      - --kubeconfig
      - "{{ kubeconfig }}"
      - config
      - rename-context
      - default
      - "{{ cluster_context }}"
  delegate_to: localhost
  become: false
  when:
    - inventory_hostname == groups['server'][0]
    - "'default' in kubeconfig_contexts.stdout_lines"
  run_once: true

- name: Select exported kubeconfig context
  ansible.builtin.command:
    argv:
      - "{{ controller_kubectl }}"
      - --kubeconfig
      - "{{ kubeconfig }}"
      - config
      - use-context
      - "{{ cluster_context }}"
  delegate_to: localhost
  become: false
  when: inventory_hostname == groups['server'][0]
  run_once: true

- name: Read exported kubeconfig current context
  ansible.builtin.command:
    argv:
      - "{{ controller_kubectl }}"
      - --kubeconfig
      - "{{ kubeconfig }}"
      - config
      - current-context
  register: exported_kubeconfig_context
  changed_when: false
  delegate_to: localhost
  become: false
  when: inventory_hostname == groups['server'][0]
  run_once: true

- name: Read exported kubeconfig API endpoint
  ansible.builtin.command:
    argv:
      - "{{ controller_kubectl }}"
      - --kubeconfig
      - "{{ kubeconfig }}"
      - config
      - view
      - --minify
      - -o
      - jsonpath={.clusters[0].cluster.server}
  register: exported_kubeconfig_server
  changed_when: false
  delegate_to: localhost
  become: false
  when: inventory_hostname == groups['server'][0]
  run_once: true

- name: Assert exported kubeconfig identity
  ansible.builtin.assert:
    that:
      - exported_kubeconfig_context.stdout == cluster_context
      - exported_kubeconfig_server.stdout == 'https://' ~ api_endpoint ~ ':' ~ (api_port | string)
    fail_msg: Exported kubeconfig context or API endpoint does not match inventory.
  when: inventory_hostname == groups['server'][0]
  run_once: true

- name: Report exported kubeconfig identity
  ansible.builtin.debug:
    msg: "Kubeconfig exported to {{ kubeconfig }} with context {{ cluster_context }}"
  when: inventory_hostname == groups['server'][0]
  run_once: true
