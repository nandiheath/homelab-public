---
- name: Resolve requested kubeconfig endpoint
  ansible.builtin.include_tasks: resolve_kubeconfig_endpoint.yml

- name: Validate controller kubeconfig destination
  delegate_to: localhost
  become: false
  run_once: true
  block:
    - name: Require an absolute controller kubeconfig destination
      ansible.builtin.assert:
        that:
          - kubeconfig is string
          - kubeconfig | length > 0
          - kubeconfig is match('^/')
          - (kubeconfig_force | default(true)) is boolean
        fail_msg: Controller kubeconfig destination inputs are invalid.

    - name: Inspect controller kubeconfig parent
      ansible.builtin.stat:
        path: "{{ kubeconfig | dirname }}"
        follow: false
      register: kubeconfig_parent_state

    - name: Require a directory-compatible kubeconfig parent
      ansible.builtin.assert:
        that:
          - not kubeconfig_parent_state.stat.exists or kubeconfig_parent_state.stat.isdir
        fail_msg: Controller kubeconfig parent exists and is not a directory.

    - name: Inspect existing controller kubeconfig
      ansible.builtin.stat:
        path: "{{ kubeconfig }}"
        follow: false
      register: existing_kubeconfig_state

    - name: Protect existing controller kubeconfig
      ansible.builtin.assert:
        that:
          - >-
            not existing_kubeconfig_state.stat.exists
            or (
              existing_kubeconfig_state.stat.isreg
              and not existing_kubeconfig_state.stat.islnk
              and existing_kubeconfig_state.stat.mode in ['0400', '0600']
            )
          - >-
            not existing_kubeconfig_state.stat.exists
            or (kubeconfig_force | default(true) | bool)
        fail_msg: Existing controller kubeconfig is unsafe or replacement was not explicitly allowed.

    - name: Create controller kubeconfig parent
      ansible.builtin.file:
        path: "{{ kubeconfig | dirname }}"
        state: directory
        mode: "0700"

    - name: Create controller kubeconfig staging directory
      ansible.builtin.tempfile:
        state: directory
        path: "{{ kubeconfig | dirname }}"
        prefix: .homelab-kubeconfig-
      register: kubeconfig_staging_directory

    - name: Restrict controller kubeconfig staging directory
      ansible.builtin.file:
        path: "{{ kubeconfig_staging_directory.path }}"
        state: directory
        mode: "0700"

- name: Fetch and verify K3s kubeconfig before promotion
  run_once: true
  block:
    - name: Wait for K3s kubeconfig
      ansible.builtin.wait_for:
        path: /etc/rancher/k3s/k3s.yaml
        state: present
        timeout: 120

    - name: Wait for K3s API readiness on the first server
      ansible.builtin.command:
        argv:
          - k3s
          - kubectl
          - get
          - --raw=/readyz
      register: k3s_readyz
      changed_when: false
      retries: 30
      delay: 2
      until: k3s_readyz.rc == 0

    - name: Fetch K3s kubeconfig to controller staging
      ansible.builtin.fetch:
        src: /etc/rancher/k3s/k3s.yaml
        dest: "{{ kubeconfig_staging_directory.path }}/kubeconfig.yaml"
        flat: true
      no_log: true

    - name: Restrict staged controller kubeconfig permissions
      ansible.builtin.file:
        path: "{{ kubeconfig_staging_directory.path }}/kubeconfig.yaml"
        state: file
        mode: "0600"
      delegate_to: localhost
      become: false

    - name: Point staged kubeconfig at selected API endpoint
      ansible.builtin.command:
        argv:
          - "{{ controller_kubectl }}"
          - --kubeconfig
          - "{{ kubeconfig_staging_directory.path }}/kubeconfig.yaml"
          - config
          - set-cluster
          - default
          - "--server={{ kubeconfig_effective_server }}"
      delegate_to: localhost
      become: false

    - name: List staged kubeconfig contexts
      ansible.builtin.command:
        argv:
          - "{{ controller_kubectl }}"
          - --kubeconfig
          - "{{ kubeconfig_staging_directory.path }}/kubeconfig.yaml"
          - config
          - get-contexts
          - -o
          - name
      register: kubeconfig_contexts
      changed_when: false
      delegate_to: localhost
      become: false

    - name: Rename default kubeconfig context
      ansible.builtin.command:
        argv:
          - "{{ controller_kubectl }}"
          - --kubeconfig
          - "{{ kubeconfig_staging_directory.path }}/kubeconfig.yaml"
          - config
          - rename-context
          - default
          - "{{ cluster_context }}"
      when: "'default' in kubeconfig_contexts.stdout_lines"
      delegate_to: localhost
      become: false

    - name: Select staged kubeconfig context
      ansible.builtin.command:
        argv:
          - "{{ controller_kubectl }}"
          - --kubeconfig
          - "{{ kubeconfig_staging_directory.path }}/kubeconfig.yaml"
          - config
          - use-context
          - "{{ cluster_context }}"
      delegate_to: localhost
      become: false

    - name: Read staged kubeconfig current context
      ansible.builtin.command:
        argv:
          - "{{ controller_kubectl }}"
          - --kubeconfig
          - "{{ kubeconfig_staging_directory.path }}/kubeconfig.yaml"
          - config
          - current-context
      register: exported_kubeconfig_context
      changed_when: false
      delegate_to: localhost
      become: false

    - name: Read staged kubeconfig API endpoint
      ansible.builtin.command:
        argv:
          - "{{ controller_kubectl }}"
          - --kubeconfig
          - "{{ kubeconfig_staging_directory.path }}/kubeconfig.yaml"
          - config
          - view
          - --minify
          - -o
          - jsonpath={.clusters[0].cluster.server}
      register: exported_kubeconfig_server
      changed_when: false
      delegate_to: localhost
      become: false

    - name: Assert staged kubeconfig identity
      ansible.builtin.assert:
        that:
          - exported_kubeconfig_context.stdout == cluster_context
          - exported_kubeconfig_server.stdout == kubeconfig_effective_server
        fail_msg: Staged kubeconfig context or API endpoint does not match the selected inventory contract.
      delegate_to: localhost
      become: false

    - name: Verify staged kubeconfig API and certificate
      ansible.builtin.command:
        argv:
          - "{{ controller_kubectl }}"
          - --kubeconfig
          - "{{ kubeconfig_staging_directory.path }}/kubeconfig.yaml"
          - get
          - --raw=/readyz
      register: staged_kubeconfig_readyz
      changed_when: false
      retries: 30
      delay: 2
      until: staged_kubeconfig_readyz.rc == 0
      delegate_to: localhost
      become: false

    - name: Atomically promote verified controller kubeconfig
      ansible.builtin.command:
        argv:
          - mv
          - -f
          - "{{ kubeconfig_staging_directory.path }}/kubeconfig.yaml"
          - "{{ kubeconfig }}"
      changed_when: true
      delegate_to: localhost
      become: false

    - name: Inspect promoted controller kubeconfig
      ansible.builtin.stat:
        path: "{{ kubeconfig }}"
        follow: false
      register: promoted_kubeconfig_state
      delegate_to: localhost
      become: false

    - name: Require promoted controller kubeconfig mode
      ansible.builtin.assert:
        that:
          - promoted_kubeconfig_state.stat.exists
          - promoted_kubeconfig_state.stat.isreg
          - not promoted_kubeconfig_state.stat.islnk
          - promoted_kubeconfig_state.stat.mode == '0600'
        fail_msg: Promoted controller kubeconfig is not a regular mode-0600 file.
      delegate_to: localhost
      become: false
  always:
    - name: Remove controller kubeconfig staging directory
      ansible.builtin.file:
        path: "{{ kubeconfig_staging_directory.path }}"
        state: absent
      when: kubeconfig_staging_directory.path is defined
      delegate_to: localhost
      become: false
      no_log: true

- name: Report exported kubeconfig identity
  ansible.builtin.debug:
    msg: "Kubeconfig exported to {{ kubeconfig }} with context {{ cluster_context }}"
  run_once: true
