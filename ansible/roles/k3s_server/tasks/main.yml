---
- name: Validate K3s server install inputs
  ansible.builtin.assert:
    that:
      - k3s_install_version is string
      - k3s_releases[k3s_install_version] is defined
      - k3s_install_script_sha256 is match('^[0-9a-f]{64}$')
      - k3s_releases[k3s_install_version].arm64_sha256 is match('^[0-9a-f]{64}$')
    fail_msg: Pinned K3s server installation inputs are incomplete.

- name: Download checksum-pinned K3s installer
  ansible.builtin.get_url:
    url: https://get.k3s.io/
    dest: /usr/local/lib/k3s-install.sh
    owner: root
    group: root
    mode: '0700'
    checksum: "sha256:{{ k3s_install_script_sha256 }}"

- name: Install initial embedded-etcd server
  ansible.builtin.command:
    argv: [/usr/local/lib/k3s-install.sh, server, --cluster-init]
  environment:
    INSTALL_K3S_VERSION: "{{ k3s_install_version }}"
  when: inventory_hostname == groups['server'][0]
  no_log: true

- name: Read initial server token without caching it
  ansible.builtin.slurp:
    src: /var/lib/rancher/k3s/server/node-token
  register: k3s_server_initial_token
  when: inventory_hostname == groups['server'][0]
  no_log: true

- name: Write root-only joining token file
  ansible.builtin.copy:
    content: "{{ hostvars[groups['server'][0]].k3s_server_initial_token.content | b64decode }}"
    dest: /etc/rancher/k3s/token
    owner: root
    group: root
    mode: '0600'
  when: inventory_hostname != groups['server'][0]
  no_log: true

- name: Install joining embedded-etcd server with token file
  ansible.builtin.command:
    argv:
      - /usr/local/lib/k3s-install.sh
      - server
      - --server
      - "https://{{ hostvars[groups['server'][0]].ansible_host | default(groups['server'][0]) }}:6443"
      - --token-file
      - /etc/rancher/k3s/token
  environment:
    INSTALL_K3S_VERSION: "{{ k3s_install_version }}"
  when: inventory_hostname != groups['server'][0]
  no_log: true

- name: Read installed K3s binary checksum
  ansible.builtin.stat:
    path: /usr/local/bin/k3s
    checksum_algorithm: sha256
  register: k3s_server_binary

- name: Require exact installed K3s binary checksum
  ansible.builtin.assert:
    that: k3s_server_binary.stat.checksum == k3s_releases[k3s_install_version].arm64_sha256
    fail_msg: Installed K3s binary checksum does not match the pinned release.

- name: Remove token-bearing legacy environment files
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - /etc/systemd/system/k3s.service.env
    - /etc/systemd/system/k3s-agent.service.env
