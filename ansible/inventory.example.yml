---
k3s_cluster:
  children:
    server:
      hosts:
        192.0.2.11: {}
        192.0.2.12: {}
        192.0.2.13: {}

  # Required Vars
  vars:
    ansible_port: 22
    ansible_user: operator
    k3s_version: v1.33.2+k3s1
    api_endpoint: "{{ hostvars[groups['server'][0]]['ansible_host'] | default(groups['server'][0]) }}"
    # Tune as your needs
    extra_server_args: "--cluster-cidr 10.244.0.0/16 --service-cidr 10.96.0.0/16 --cluster-dns 10.96.0.10 --disable traefik --disable-network-policy --disable servicelb --disable-kube-proxy --flannel-backend=none"
    extra_agent_args: ""
