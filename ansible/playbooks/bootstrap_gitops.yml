---
# The only cluster-mutating bootstrap path. Run with private inventory and operator-supplied
# mode-restricted credential files; CI performs syntax checks only.
- import_playbook: install.yaml

- name: Bootstrap GitOps after the no-Flannel control plane is available
  hosts: server[0]
  become: true
  gather_facts: false
  vars:
    k3s_kubeconfig: /etc/rancher/k3s/k3s.yaml
    public_artifacts_root: "{{ playbook_dir }}/../../artifacts/infrastructure"
  tasks:
    - name: Apply Cilium before scheduling dependent controllers
      ansible.builtin.command:
        cmd: "k3s kubectl --kubeconfig {{ k3s_kubeconfig }} apply -f {{ public_artifacts_root }}/cilium"
      changed_when: true

    - name: Wait for Cilium readiness
      ansible.builtin.command:
        cmd: "k3s kubectl --kubeconfig {{ k3s_kubeconfig }} -n kube-system rollout status daemonset/cilium --timeout=10m"
      changed_when: false

    - name: Apply Argo CD and secret-controller prerequisites
      ansible.builtin.command:
        cmd: "k3s kubectl --kubeconfig {{ k3s_kubeconfig }} apply -f {{ item }}"
      loop:
        - "{{ public_artifacts_root }}/argocd"
        - "{{ public_artifacts_root }}/external-secrets"
        - "{{ public_artifacts_root }}/1password-connect"
      changed_when: true

    - name: Require operator-supplied runtime credential manifests
      ansible.builtin.assert:
        that:
          - bootstrap_connect_credentials_file is defined
          - bootstrap_github_app_credentials_file is defined
        fail_msg: "Provide mode-restricted credential manifest paths through private inventory or extra vars."

    - name: Apply operator-supplied bootstrap credential manifests
      ansible.builtin.command:
        cmd: "k3s kubectl --kubeconfig {{ k3s_kubeconfig }} apply -f {{ item }}"
      loop:
        - "{{ bootstrap_connect_credentials_file }}"
        - "{{ bootstrap_github_app_credentials_file }}"
      changed_when: true
      no_log: true

    - name: Wait for Argo repository credentials
      ansible.builtin.command:
        cmd: >-
          k3s kubectl --kubeconfig {{ k3s_kubeconfig }} -n argocd wait
          --for=jsonpath='{.metadata.labels.argocd\.argoproj\.io/secret-type}'=repo-creds
          secret --all --timeout=5m
      changed_when: false

    - name: Apply the rendered public root Application
      ansible.builtin.command:
        cmd: "k3s kubectl --kubeconfig {{ k3s_kubeconfig }} apply -f {{ public_artifacts_root }}/bootstrap/application_infrastructure-app-of-apps.yml"
      changed_when: true
